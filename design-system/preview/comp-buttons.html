<!-- @dsCard group="Components" -->
<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--cream);font-family:var(--font-sans)}
  .wrap{padding:26px 28px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  button{font-family:inherit;font-size:15px;font-weight:600;border:0;cursor:pointer;border-radius:var(--r-btn);padding:13px 26px}
  .primary{background:var(--brick);color:#fff}
  .success{background:var(--success);color:#fff}
  .ghost{background:#fff;color:#8B7D6B;border:1px solid var(--hairline-2)}
  .soft{background:var(--brick-soft);color:var(--brick-deep)}
  .text{background:transparent;color:var(--brick);padding:13px 8px}
  .tag{flex-basis:100%;font-size:10.5px;color:var(--taupe);letter-spacing:.04em}
</style></head>
<body><div class="wrap">
  <div class="tag">BUTTONS · soft 14px radius · 600 weight</div>
  <button class="primary">Записаться на урок</button>
  <button class="success">Знаю</button>
  <button class="ghost">Повтор</button>
  <button class="soft">Сложно</button>
  <button class="text">Узнать стоимость →</button>
</div></body></html>
