<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--cream);font-family:var(--font-sans)}
  .wrap{padding:30px 28px;display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
  .w{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
  .tile{width:96px;height:96px;border-radius:var(--r-md);background:var(--brick-soft);
        display:flex;align-items:center;justify-content:center}
  .tile svg{width:52px;height:52px;display:block;stroke:var(--brick-deep);stroke-width:2;
            fill:none;stroke-linecap:round;stroke-linejoin:round}
  .lab{font-size:14px;font-weight:600;color:var(--ink)}
</style></head>
<body><div class="wrap">

  <div class="w">
    <div class="tile">
      <svg viewBox="0 0 48 48">
        <path d="M24 8 44 16 24 24 4 16 24 8Z"/>
        <path d="M14 20v8c0 2.5 4.5 4.5 10 4.5s10-2 10-4.5v-8"/>
        <path d="M44 16v9"/><circle cx="44" cy="27" r="1.6"/>
      </svg>
    </div>
    <div class="lab">Учителя</div>
  </div>

  <div class="w">
    <div class="tile">
      <svg viewBox="0 0 48 48">
        <rect x="11" y="17" width="26" height="19" rx="5"/>
        <path d="M24 17v-6"/><circle cx="24" cy="8.5" r="2.2"/>
        <path d="M11 24H7v6h4"/><path d="M37 24h4v6h-4"/>
        <circle cx="19" cy="26" r="1.6"/><circle cx="29" cy="26" r="1.6"/>
        <path d="M19 31h10"/>
      </svg>
    </div>
    <div class="lab">Полезный чат-бот</div>
  </div>

  <div class="w">
    <div class="tile">
      <svg viewBox="0 0 48 48">
        <path d="M13 7h14l8 8v26a2 2 0 0 1-2 2H13a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"/>
        <path d="M27 7v8h8"/>
        <path d="M30.5 24.5 33 27l-9.5 9.5-3.5 1 1-3.5 9.5-9.5Z"/>
      </svg>
    </div>
    <div class="lab">Бесплатный урок</div>
  </div>

  <div class="w">
    <div class="tile">
      <svg viewBox="0 0 48 48">
        <rect x="11" y="10" width="26" height="31" rx="3"/>
        <rect x="18" y="6.5" width="12" height="7" rx="2.2"/>
        <path d="M17 26.5 22 31.5 31 21.5"/>
      </svg>
    </div>
    <div class="lab">Как поступить</div>
  </div>

</div></body></html>
