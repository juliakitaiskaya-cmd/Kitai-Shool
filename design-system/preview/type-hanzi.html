<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--cream)}
  .wrap{padding:22px 28px;display:flex;align-items:center;gap:30px}
  .big{font-family:var(--font-han);color:var(--ink);font-size:78px;line-height:1}
  .pin{font-family:var(--font-sans);color:var(--taupe);font-size:15px;margin-top:6px}
  .col .tag{font-family:var(--font-sans);font-size:10.5px;color:var(--taupe);letter-spacing:.04em;margin-bottom:6px}
  .motif{display:flex;gap:18px;font-family:var(--font-han);color:var(--brick);font-size:46px;opacity:.9}
  .motif span:nth-child(2){color:var(--ink);opacity:.18}
</style></head>
<body><div class="wrap">
  <div class="col"><div class="tag">FLASHCARD HANZI · Noto Serif SC</div><div class="big">或者</div><div class="pin">huò zhě · или</div></div>
  <div class="col"><div class="tag">DECORATIVE MOTIF · 启 始 奖 速</div><div class="motif"><span>启</span><span>始</span><span>奖</span></div></div>
</div></body></html>
