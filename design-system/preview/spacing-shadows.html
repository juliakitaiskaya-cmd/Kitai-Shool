<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--cream);font-family:var(--font-sans)}
  .wrap{padding:30px 28px;display:flex;gap:30px}
  .e{flex:1;display:flex;flex-direction:column;align-items:center;gap:12px}
  .box{width:100%;height:60px;background:var(--surface);border-radius:var(--r-md);border:1px solid var(--hairline)}
  .lab{font-size:11.5px;color:var(--ink);font-weight:600}
  .sub{font-size:10.5px;color:var(--taupe);margin-top:-8px}
</style></head>
<body><div class="wrap">
  <div class="e"><div class="box"></div><div class="lab">flat</div><div class="sub">inputs · chips</div></div>
  <div class="e"><div class="box"></div><div class="lab">flat</div><div class="sub">default card</div></div>
  <div class="e"><div class="box"></div><div class="lab">flat</div><div class="sub">modal · hover</div></div>
</div></body></html>
