<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--cream);font-family:var(--font-sans)}
  .wrap{padding:24px 28px;display:flex;gap:20px;align-items:flex-end}
  .r{display:flex;flex-direction:column;align-items:center;gap:8px}
  .box{width:84px;height:62px;background:var(--surface);border:1px solid var(--hairline);box-shadow:var(--shadow-sm)}
  .lab{font-size:11px;color:var(--ink);font-weight:600}
  .sub{font-size:10.5px;color:var(--taupe)}
</style></head>
<body><div class="wrap">
  <div class="r"><div class="box" style="border-radius:8px"></div><div class="lab">xs · 8</div></div>
  <div class="r"><div class="box" style="border-radius:12px"></div><div class="lab">sm · 12</div></div>
  <div class="r"><div class="box" style="border-radius:14px"></div><div class="lab">btn · 14</div><div class="sub">buttons</div></div>
  <div class="r"><div class="box" style="border-radius:16px"></div><div class="lab">md · 16</div><div class="sub">cards</div></div>
</div></body></html>
