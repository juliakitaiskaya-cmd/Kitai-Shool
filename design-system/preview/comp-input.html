<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--cream);font-family:var(--font-sans)}
  .wrap{padding:22px 28px;display:flex;gap:16px}
  .field{flex:1;background:#fff;border:1px solid var(--hairline-2);border-radius:var(--r-md);padding:16px 18px;color:var(--taupe);font-size:15px;display:flex;align-items:center;gap:10px}
  .field .han{font-family:var(--font-han-ui);color:var(--ink-2)}
  .ico{width:18px;height:18px;flex:none;color:var(--taupe)}
  .ico svg{width:100%;height:100%;display:block;stroke:currentColor;stroke-width:1.75;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(44,36,32,.10)}
  .focus .ico{color:var(--ink)}
  .lab{font-size:10.5px;color:var(--taupe);letter-spacing:.04em;margin-bottom:8px}
</style></head>
<body><div class="wrap" style="flex-direction:column;gap:14px">
  <div><div class="lab">SEARCH INPUT — default</div><div class="field"><span class="ico"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>Поиск слова: <span class="han">汉字</span>, pinyin или перевод…</div></div>
  <div><div class="lab">SEARCH INPUT — focus</div><div class="field focus" style="color:var(--ink)"><span class="ico"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>把<span style="color:var(--taupe)">|</span></div></div>
</div></body></html>
