<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--cream);font-family:var(--font-sans)}
  .wrap{padding:26px 28px;display:flex;align-items:flex-end;gap:16px}
  .s{display:flex;flex-direction:column;align-items:center;gap:7px}
  .bar{background:var(--taupe);border-radius:3px;width:26px}
  .lab{font-size:11px;color:var(--ink);font-weight:600}
  .px{font-size:10px;color:var(--taupe)}
</style></head>
<body><div class="wrap">
  <div class="s"><div class="bar" style="height:4px"></div><div class="lab">1</div><div class="px">4</div></div>
  <div class="s"><div class="bar" style="height:8px"></div><div class="lab">2</div><div class="px">8</div></div>
  <div class="s"><div class="bar" style="height:12px"></div><div class="lab">3</div><div class="px">12</div></div>
  <div class="s"><div class="bar" style="height:16px"></div><div class="lab">4</div><div class="px">16</div></div>
  <div class="s"><div class="bar" style="height:24px"></div><div class="lab">5</div><div class="px">24</div></div>
  <div class="s"><div class="bar" style="height:32px"></div><div class="lab">6</div><div class="px">32</div></div>
  <div class="s"><div class="bar" style="height:48px"></div><div class="lab">7</div><div class="px">48</div></div>
  <div class="s"><div class="bar" style="height:64px"></div><div class="lab">8</div><div class="px">64</div></div>
  <div class="s"><div class="bar" style="height:96px"></div><div class="lab">9</div><div class="px">96</div></div>
</div></body></html>
