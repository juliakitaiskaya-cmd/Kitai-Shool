<!-- @dsCard group="Components" -->
<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--cream);font-family:var(--font-sans)}
  .wrap{padding:24px 28px;display:flex;flex-direction:column;gap:18px}
  .group{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .tag{font-size:10.5px;color:var(--taupe);letter-spacing:.04em;flex-basis:100%}
  .chip{border:1px solid var(--hairline-2);background:#fff;color:var(--ink-2);border-radius:var(--r-pill);padding:8px 16px;font-size:13.5px;display:inline-flex;align-items:center;gap:7px}
  .chip .dot{width:7px;height:7px;border-radius:50%;border:1px solid var(--taupe)}
  .badge{background:var(--success-soft);color:#1d7a44;border-radius:var(--r-pill);padding:5px 12px;font-size:12px;font-weight:600}
  .badge.brick{background:var(--brick-soft);color:var(--brick-deep)}
  .seg{display:inline-flex;background:var(--cream-2);border-radius:var(--r-pill);padding:4px}
  .seg b{padding:7px 16px;border-radius:var(--r-pill);font-size:13px;font-weight:600;color:var(--taupe)}
  .seg b.on{background:#fff;color:var(--ink);box-shadow:var(--shadow-sm)}
</style></head>
<body><div class="wrap">
  <div class="group"><span class="tag">CHIPS / TOGGLES</span>
    <span class="chip"><span class="dot"></span>Пиньинь</span>
    <span class="chip"><span class="dot"></span>Перевод</span>
    <span class="badge">Открыт набор</span>
    <span class="badge brick">Формируется</span>
  </div>
  <div class="group"><span class="tag">SEGMENTED CONTROL</span>
    <span class="seg"><b class="on">Карточки</b><b>Диалог</b><b>Написание</b></span>
  </div>
</div></body></html>
