<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--cream);font-family:var(--font-sans);color:var(--ink)}
  .wrap{padding:22px 24px}
  .row{display:flex;gap:14px}
  .sw{flex:1;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--hairline);background:var(--surface)}
  .chip{height:54px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:13px}
  .meta{padding:8px 10px}
  .name{font-size:12.5px;font-weight:600}
  .hex{font-size:11px;color:var(--taupe);font-variant-numeric:tabular-nums;text-transform:uppercase}
</style></head>
<body><div class="wrap"><div class="row">
  <div class="sw"><div class="chip" style="background:#27B260">Знаю</div><div class="meta"><div class="name">Success</div><div class="hex">#27B260</div></div></div>
  <div class="sw"><div class="chip" style="background:#E3F6E9;color:#1d7a44">soft</div><div class="meta"><div class="name">Success soft</div><div class="hex">#E3F6E9</div></div></div>
  <div class="sw"><div class="chip" style="background:#E08A1E">🔥</div><div class="meta"><div class="name">Warn / streak</div><div class="hex">#E08A1E</div></div></div>
  <div class="sw"><div class="chip" style="background:#3E7BC2">link</div><div class="meta"><div class="name">Info</div><div class="hex">#3E7BC2</div></div></div>
</div></div></body></html>
