<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--cream);font-family:var(--font-sans);color:var(--ink)}
  .wrap{padding:22px 24px}
  .row{display:flex;gap:14px}
  .sw{flex:1;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--hairline);background:var(--surface)}
  .chip{height:66px}
  .meta{padding:8px 10px}
  .name{font-size:12.5px;font-weight:600;letter-spacing:.01em}
  .hex{font-size:11px;color:var(--taupe);font-variant-numeric:tabular-nums;text-transform:uppercase}
</style></head>
<body><div class="wrap"><div class="row">
  <div class="sw"><div class="chip" style="background:#A41E3A"></div><div class="meta"><div class="name">Brick</div><div class="hex">#A41E3A</div></div></div>
  <div class="sw"><div class="chip" style="background:#841630"></div><div class="meta"><div class="name">Brick deep</div><div class="hex">#841630</div></div></div>
  <div class="sw"><div class="chip" style="background:#F7E6EB"></div><div class="meta"><div class="name">Brick soft</div><div class="hex">#F7E6EB</div></div></div>
  <div class="sw"><div class="chip" style="background:#2C2420"></div><div class="meta"><div class="name">Ink</div><div class="hex">#2C2420</div></div></div>
  <div class="sw"><div class="chip" style="background:#8B7D6B"></div><div class="meta"><div class="name">Taupe</div><div class="hex">#8B7D6B</div></div></div>
</div></div></body></html>
