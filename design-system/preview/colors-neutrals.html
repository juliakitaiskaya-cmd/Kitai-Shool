<!-- @dsCard group="Colors" -->
<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--cream);font-family:var(--font-sans);color:var(--ink)}
  .wrap{padding:22px 24px}
  .row{display:flex;gap:14px}
  .sw{flex:1;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--hairline);background:var(--surface)}
  .chip{height:66px}
  .meta{padding:8px 10px}
  .name{font-size:12.5px;font-weight:600}
  .hex{font-size:11px;color:var(--taupe);font-variant-numeric:tabular-nums;text-transform:uppercase}
</style></head>
<body><div class="wrap"><div class="row">
  <div class="sw"><div class="chip" style="background:#FAF7F2"></div><div class="meta"><div class="name">Cream / page</div><div class="hex">#FAF7F2</div></div></div>
  <div class="sw"><div class="chip" style="background:#F3EDE3"></div><div class="meta"><div class="name">Cream alt</div><div class="hex">#F3EDE3</div></div></div>
  <div class="sw"><div class="chip" style="background:#FFFFFF"></div><div class="meta"><div class="name">Surface</div><div class="hex">#FFFFFF</div></div></div>
  <div class="sw"><div class="chip" style="background:#FCF6E2"></div><div class="meta"><div class="name">Highlight</div><div class="hex">#FCF6E2</div></div></div>
  <div class="sw"><div class="chip" style="background:#EAE3D8"></div><div class="meta"><div class="name">Hairline</div><div class="hex">#EAE3D8</div></div></div>
</div></div></body></html>
