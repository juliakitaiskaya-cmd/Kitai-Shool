<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--cream);font-family:var(--font-sans)}
  .wrap{padding:24px 28px;display:flex;gap:28px;align-items:center}
  .card{background:#fff;border:1px solid var(--hairline);border-radius:var(--r-md);padding:18px 22px;display:flex;align-items:center;justify-content:center}
  .dark{background:var(--ink)}
  img{height:72px;display:block}
  .lab{font-size:10.5px;color:var(--taupe);letter-spacing:.04em;margin-top:8px;text-align:center}
</style></head>
<body><div class="wrap">
  <div><div class="card"><img src="../assets/kitai-logo.svg" alt="Kitai School"></div><div class="lab">основной</div></div>
  <div><div class="card dark"><img src="../assets/kitai-logo-onink.svg" alt="Kitai School"></div><div class="lab">on ink (reversed)</div></div>
</div></body></html>
