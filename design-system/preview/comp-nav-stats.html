<!-- @dsCard group="Components" -->
<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:var(--cream);font-family:var(--font-sans)}
  .wrap{padding:22px 28px;display:flex;gap:26px;align-items:flex-start}
  .lab{font-size:10.5px;color:var(--taupe);letter-spacing:.04em;margin-bottom:10px}
  /* sidebar nav */
  .nav{background:#fff;border:1px solid var(--hairline);border-radius:var(--r-md);padding:8px;display:flex;flex-direction:column;gap:2px;width:78px}
  .item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px;border-radius:var(--r-sm);font-size:11px;color:var(--taupe)}
  .item.on{background:#FFF0E0;color:var(--ink);font-weight:600}
  .ico{width:20px;height:20px;display:block}
  .ico svg{width:100%;height:100%;display:block;stroke:currentColor;stroke-width:1.75;fill:none;stroke-linecap:round;stroke-linejoin:round}
  /* stat tiles */
  .tiles{display:flex;gap:12px}
  .tile{background:#fff;border:1px solid var(--hairline);border-radius:var(--r-md);box-shadow:var(--shadow-card);padding:16px 20px;text-align:center;min-width:96px}
  .tile .ico{width:22px;height:22px;margin:0 auto;color:var(--brick)}
  .tile .num{font-family:var(--font-display);font-weight:600;font-size:25px;color:var(--ink);margin-top:6px;white-space:nowrap}
  .tile .cap{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--taupe);margin-top:2px}
</style></head>
<body><div class="wrap">
  <div><div class="lab">SIDEBAR NAV</div>
    <div class="nav">
      <div class="item on"><span class="ico"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"/><path d="M9.5 21v-6h5v6"/></svg></span>Главная</div>
      <div class="item"><span class="ico"><svg viewBox="0 0 24 24"><path d="m12 3 9 4.5-9 4.5-9-4.5L12 3Z"/><path d="m3 12 9 4.5L21 12"/><path d="m3 16.5 9 4.5 9-4.5"/></svg></span>Уроки</div>
      <div class="item"><span class="ico"><svg viewBox="0 0 24 24"><path d="M12 6.5C10.5 5 8 4.5 4 4.8V18c4-.3 6.5.2 8 1.7 1.5-1.5 4-2 8-1.7V4.8c-4-.3-6.5.2-8 1.7Z"/><path d="M12 6.5v13.2"/></svg></span>Учить</div>
      <div class="item"><span class="ico"><svg viewBox="0 0 24 24"><path d="M20 12a7.5 7.5 0 0 1-10.8 6.7L4 20l1.3-5.2A7.5 7.5 0 1 1 20 12Z"/></svg></span>Чат</div>
    </div></div>
  <div><div class="lab">STAT TILES</div>
    <div class="tiles">
      <div class="tile"><div class="ico"><svg viewBox="0 0 24 24"><path d="M6 3h11a1 1 0 0 1 1 1v15.5a.5.5 0 0 1-.5.5H7a2 2 0 0 1-2-2V4a1 1 0 0 1 1-1Z"/><path d="M5 17.5A2 2 0 0 1 7 16h11"/></svg></div><div class="num">612</div><div class="cap">слова</div></div>
      <div class="tile"><div class="ico"><svg viewBox="0 0 24 24"><path d="m12 3 9 4.5-9 4.5-9-4.5L12 3Z"/><path d="m3 12 9 4.5L21 12"/><path d="m3 16.5 9 4.5 9-4.5"/></svg></div><div class="num">38 / 102</div><div class="cap">уроки</div></div>
      <div class="tile"><div class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></svg></div><div class="num">78%</div><div class="cap">точность</div></div>
    </div></div>
</div></body></html>
