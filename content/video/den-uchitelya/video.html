<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>С Днём учителя · 教师节快乐 — видео</title>
<link rel="stylesheet" href="fonts.css">
<style>
  :root{
    --brick:#A41E3A; --brick-deep:#841630; --brick-soft:#F7E6EB;
    --ink:#2C2420; --ink-2:#5A4F45; --taupe:#8B7D6B; --taupe-soft:#B8AC9C;
    --cream:#FAF7F2; --surface:#FFFFFF; --hairline:#EAE3D8; --highlight:#FCF6E2;
    --gold:#D9A441;
    --font-display:'Cormorant Garamond',Georgia,serif;
    --font-sans:'Inter',Arial,sans-serif;
    --font-han:'Noto Serif SC',serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#000}
  #stage{
    position:relative; width:1080px; height:1920px; overflow:hidden;
    background:var(--cream); color:var(--ink);
    font-family:var(--font-sans); -webkit-font-smoothing:antialiased;
  }
  #stage::before{
    content:''; position:absolute; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(1300px 900px at 50% -10%, #FFFFFF 0%, rgba(255,255,255,0) 60%),
      radial-gradient(1000px 820px at 50% 108%, rgba(164,30,58,.10) 0%, rgba(164,30,58,0) 62%);
  }

  /* ---------- сквозное ---------- */
  .brandbar{
    position:absolute; left:80px; right:80px; top:70px; z-index:8;
    display:flex; align-items:center; justify-content:space-between;
  }
  .brandbar img{height:64px}
  .brandbar .site{font-size:26px; letter-spacing:.16em; text-transform:uppercase; color:var(--taupe); font-weight:600}

  .ghost-han{
    position:absolute; right:-90px; top:520px; z-index:0;
    font-family:var(--font-han); font-weight:700; font-size:640px; line-height:.8;
    color:var(--ink); opacity:.045;
  }
  .fade-bottom{
    position:absolute; left:0; right:0; bottom:0; height:260px; z-index:5; opacity:0;
    background:linear-gradient(rgba(250,247,242,0) 0%, rgba(250,247,242,.55) 60%, rgba(250,247,242,.92) 100%);
  }

  /* персонаж — только в сценах про марафон */
  #hero{
    position:absolute; right:-40px; bottom:0; height:980px; z-index:3; opacity:0;
    transform-origin:50% 100%; filter:drop-shadow(0 30px 60px rgba(44,36,32,.16));
  }

  /* ---------- свеча ---------- */
  .candle-wrap{position:absolute; right:118px; top:980px; z-index:2; opacity:0}
  .candle{position:relative; width:120px; height:300px;
    background:linear-gradient(100deg,#FFFDF7 0%,#F2E6D2 45%,#DFCCAE 100%);
    border-radius:14px 14px 8px 8px;
    box-shadow:0 24px 60px rgba(44,36,32,.16), inset -14px 0 26px rgba(160,140,110,.28);
  }
  .candle::before{content:''; position:absolute; left:50%; top:-9px; transform:translateX(-50%);
    width:120px; height:26px; border-radius:50%; background:#FFFBF2;
    box-shadow:inset 0 -6px 10px rgba(160,140,110,.35)}
  .wick{position:absolute; left:50%; top:-30px; transform:translateX(-50%);
    width:5px; height:26px; background:#3A2E24; border-radius:3px}
  .flame{
    position:absolute; left:50%; bottom:318px; width:54px; height:96px;
    transform-origin:50% 100%;
    background:radial-gradient(ellipse at 50% 75%, #FFF6D0 0%, #FFC64D 38%, #F08A22 70%, rgba(230,110,20,0) 100%);
    border-radius:50% 50% 46% 46% / 62% 62% 38% 38%;
    filter:blur(1px);
  }
  .glow{
    position:absolute; left:50%; bottom:250px; width:520px; height:520px; transform:translate(-50%,50%);
    background:radial-gradient(circle, rgba(255,190,90,.30) 0%, rgba(255,190,90,0) 62%);
    pointer-events:none;
  }

  /* ---------- сцены ---------- */
  .scene{
    position:absolute; inset:0; display:none; z-index:4;
    flex-direction:column; justify-content:center; align-items:flex-start;
    padding:270px 80px 220px;
  }
  .scene.on{display:flex}
  .scene > *{max-width:920px}
  .scene.narrow{justify-content:flex-start; padding:210px 80px 180px}
  .scene.narrow > *{max-width:660px}
  .scene.narrow .m-title{font-size:68px}

  .kicker{
    font-size:30px; font-weight:700; letter-spacing:.22em; text-transform:uppercase;
    color:var(--brick); margin-bottom:34px;
  }
  .h-q{font-size:76px; font-weight:800; line-height:1.14; letter-spacing:-.02em; color:var(--ink); max-width:800px}
  .h-q .red{color:var(--brick)}
  .lead{font-size:36px; line-height:1.45; color:var(--ink-2); margin-top:36px; max-width:820px}

  /* поздравление */
  .greet{display:flex; gap:18px}
  .greet span{
    font-family:var(--font-han); font-weight:700; font-size:158px; line-height:1;
    color:var(--brick); display:inline-block;
  }
  .py{font-family:var(--font-display); font-style:italic; font-weight:600; font-size:64px; color:var(--taupe); margin-top:30px}
  .greet-ru{font-size:72px; font-weight:800; color:var(--ink); margin-top:16px; letter-spacing:-.01em}

  /* цитата */
  .quote{
    font-family:var(--font-display); font-weight:600; font-size:70px; line-height:1.2;
    color:var(--ink); max-width:700px;
  }
  .quote-mark{font-family:var(--font-display); font-size:180px; line-height:.5; color:var(--brick); opacity:.28}
  .quote-src{font-size:30px; color:var(--taupe); margin-top:34px; letter-spacing:.04em}

  /* карточки */
  .rows{display:flex; flex-direction:column; gap:26px; width:920px}
  .row-card{
    background:var(--surface); border:1px solid var(--hairline); border-radius:34px;
    padding:34px 40px; box-shadow:0 18px 44px rgba(44,36,32,.07);
    display:flex; gap:28px; align-items:center;
  }
  .row-card .n{
    flex:none; font-family:var(--font-display); font-style:italic; font-weight:700;
    font-size:56px; color:var(--brick); line-height:1; min-width:56px;
  }
  .row-card .han{
    flex:none; font-family:var(--font-han); font-weight:700; font-size:60px; color:var(--brick); line-height:1;
  }
  .row-card .t{font-size:34px; line-height:1.3; color:var(--ink); font-weight:600}
  .row-card .t small{display:block; font-size:28px; font-weight:400; color:var(--ink-2); margin-top:8px}

  /* галочки */
  .checks{display:flex; flex-direction:column; gap:22px; width:920px; margin-top:10px}
  .check{display:flex; gap:24px; align-items:center; font-size:36px; color:var(--ink); font-weight:600}
  .check .box{
    flex:none; width:62px; height:62px; border-radius:50%; background:var(--brick-soft);
    display:flex; align-items:center; justify-content:center;
  }
  .check svg{width:34px; height:34px}
  .check path{stroke:var(--brick); stroke-width:9; fill:none; stroke-linecap:round; stroke-linejoin:round}

  .badge{
    display:inline-block; background:var(--brick); color:#fff; border-radius:999px;
    padding:18px 48px; font-size:34px; font-weight:800; letter-spacing:.16em; text-transform:uppercase;
    box-shadow:0 18px 40px rgba(164,30,58,.32);
  }
  .m-title{
    font-family:var(--font-display); font-weight:700; font-size:82px; line-height:1.08;
    color:var(--brick); margin-top:34px; text-transform:uppercase;
  }
  .free{
    display:inline-block; margin-top:30px; background:var(--highlight); border:1px solid #EFE3C2;
    border-radius:999px; padding:18px 44px; font-size:36px; font-weight:800; color:var(--ink);
  }
  .cta{
    background:var(--surface); border:1px solid var(--hairline); border-radius:40px;
    padding:44px 50px; box-shadow:0 26px 70px rgba(44,36,32,.10); margin-top:44px; width:660px;
  }
  .cta .label{font-size:28px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:var(--taupe); margin-bottom:14px}
  .cta .big{font-size:40px; font-weight:800; color:var(--brick); line-height:1.2; white-space:nowrap}
</style>
</head>
<body>
<div id="stage">
  <div class="ghost-han" id="ghost">师</div>
  <img id="hero" src="character.png" alt="">

  <div class="candle-wrap" id="candle">
    <div class="glow" id="glow"></div>
    <div class="flame" id="flame"></div>
    <div class="candle"><div class="wick"></div></div>
  </div>

  <div class="fade-bottom" id="fade"></div>

  <div class="brandbar">
    <img src="../../../design-system/assets/kitai-logo.svg" alt="Kitai School">
    <div class="site">kitai-school.ru</div>
  </div>
</div>

<script>
const stage = document.getElementById('stage');
const el = html => { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; };

const scenes = [];
function addScene(dur, html){
  const node = el(html);
  stage.appendChild(node);
  const start = scenes.length ? scenes[scenes.length - 1].end : 0;
  scenes.push({ node, start, end: start + dur });
  return node;
}

/* 1. Поздравление */
addScene(4.6, `
  <div class="scene">
    <div class="kicker anim" data-d="0" data-y="20">10 сентября · Китай</div>
    <div class="greet">
      <span class="anim" data-d="0.15" data-y="40" data-sc="0.8">教</span>
      <span class="anim" data-d="0.30" data-y="40" data-sc="0.8">师</span>
      <span class="anim" data-d="0.45" data-y="40" data-sc="0.8">节</span>
      <span class="anim" data-d="0.60" data-y="40" data-sc="0.8">快</span>
      <span class="anim" data-d="0.75" data-y="40" data-sc="0.8">乐</span>
    </div>
    <div class="py anim" data-d="1.0" data-y="24">jiàoshī jié kuàilè</div>
    <div class="greet-ru anim" data-d="1.2" data-y="28">С Днём учителя!</div>
  </div>
`);

/* 2. Что за праздник */
addScene(4.4, `
  <div class="scene">
    <div class="kicker anim" data-d="0" data-y="20">Что это за день</div>
    <div class="h-q">
      <div class="anim" data-d="0.15" data-y="40">Один из самых</div>
      <div class="anim" data-d="0.32" data-y="40"><span class="red">уважаемых</span></div>
      <div class="anim" data-d="0.49" data-y="40">праздников в Китае</div>
    </div>
    <div class="lead anim" data-d="0.9" data-y="28">Учителей поздравляют всей страной: их благодарят, приходят к ним спустя годы после выпуска и говорят спасибо публично.</div>
  </div>
`);

/* 3. Поговорка про свечу */
addScene(4.8, `
  <div class="scene">
    <div class="quote-mark anim" data-d="0" data-y="20">«</div>
    <div class="quote">
      <div class="anim" data-d="0.2" data-y="36">Учитель — как свеча:</div>
      <div class="anim" data-d="0.5" data-y="36">сгорает сам,</div>
      <div class="anim" data-d="0.8" data-y="36">освещая путь другим</div>
    </div>
    <div class="quote-src anim" data-d="1.3" data-y="22">Китайская поговорка</div>
  </div>
`);

/* 4. Наша команда */
addScene(5.0, `
  <div class="scene">
    <div class="kicker anim" data-d="0" data-y="20">Наши наставники</div>
    <div class="rows">
      <div class="row-card anim" data-d="0.15" data-y="34" data-sc="0.96">
        <div class="n">30+</div>
        <div class="t">Доцент кафедры восточных языков<small>Больше тридцати лет преподавания</small></div>
      </div>
      <div class="row-card anim" data-d="0.35" data-y="34" data-sc="0.96">
        <div class="han">博</div>
        <div class="t">Доктор филологических наук<small>Научная база за каждым объяснением</small></div>
      </div>
      <div class="row-card anim" data-d="0.55" data-y="34" data-sc="0.96">
        <div class="han">师</div>
        <div class="t">Русские и китайские преподаватели<small>С профильным педагогическим образованием</small></div>
      </div>
    </div>
  </div>
`);

/* 5. Методика и результаты */
addScene(5.2, `
  <div class="scene">
    <div class="kicker anim" data-d="0" data-y="20">Методика «ОДиН М»</div>
    <div class="h-q anim" data-d="0.12" data-y="34" style="font-size:60px; max-width:900px">К чему приходят ученики</div>
    <div class="checks">
      <div class="check anim" data-d="0.4" data-y="26">
        <div class="box"><svg viewBox="0 0 64 64"><path d="M12 34 L26 48 L52 18"></path></svg></div>
        <div>HSK, HSKK, YCT и CSCA на высокие баллы</div>
      </div>
      <div class="check anim" data-d="0.6" data-y="26">
        <div class="box"><svg viewBox="0 0 64 64"><path d="M12 34 L26 48 L52 18"></path></svg></div>
        <div>Поступление в университеты Китая</div>
      </div>
      <div class="check anim" data-d="0.8" data-y="26">
        <div class="box"><svg viewBox="0 0 64 64"><path d="M12 34 L26 48 L52 18"></path></svg></div>
        <div>Китайский в работе и переговорах</div>
      </div>
      <div class="check anim" data-d="1.0" data-y="26">
        <div class="box"><svg viewBox="0 0 64 64"><path d="M12 34 L26 48 L52 18"></path></svg></div>
        <div>Свободное общение в поездках</div>
      </div>
    </div>
  </div>
`);

/* 6. Марафон */
addScene(5.2, `
  <div class="scene narrow">
    <div class="anim" data-d="0" data-y="26" data-sc="0.9"><div class="badge">Скоро старт</div></div>
    <div class="m-title anim" data-d="0.18" data-y="36">Китайский<br>на раз-два-три</div>
    <div class="rows" style="width:660px; margin-top:38px; gap:20px">
      <div class="row-card anim" data-d="0.5" data-y="30" data-sc="0.96" style="padding:26px 32px">
        <div class="han" style="font-size:48px">一</div>
        <div class="t" style="font-size:30px">Знакомство и рассказ о себе</div>
      </div>
      <div class="row-card anim" data-d="0.68" data-y="30" data-sc="0.96" style="padding:26px 32px">
        <div class="han" style="font-size:48px">二</div>
        <div class="t" style="font-size:30px">Счёт и свой номер телефона</div>
      </div>
      <div class="row-card anim" data-d="0.86" data-y="30" data-sc="0.96" style="padding:26px 32px">
        <div class="han" style="font-size:48px">三</div>
        <div class="t" style="font-size:30px">Еда и напитки: что вы любите</div>
      </div>
    </div>
  </div>
`);

/* 7. Вебинар, бесплатно, запись */
addScene(5.4, `
  <div class="scene narrow">
    <div class="kicker anim" data-d="0" data-y="20">А на четвёртый день</div>
    <div class="h-q anim" data-d="0.15" data-y="36" style="font-size:58px; max-width:640px">Живой вебинар: как учить китайский и не бросить</div>
    <div class="anim" data-d="0.5" data-y="26" data-sc="0.9"><div class="free">Участие бесплатное</div></div>
    <div class="cta anim" data-d="0.8" data-y="34" data-sc="0.96">
      <div class="label">Запись на марафон</div>
      <div class="big">Пишите в личные сообщения</div>
    </div>
  </div>
`);

const DUR = scenes[scenes.length - 1].end;
window.VIDEO_DURATION = DUR;

/* ---------- вспомогательное ---------- */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const seg = (t, s, d) => clamp((t - s) / d, 0, 1);
const FADE = 0.5;

const hero = document.getElementById('hero');
const candle = document.getElementById('candle');
const flame = document.getElementById('flame');
const glow = document.getElementById('glow');
const ghost = document.getElementById('ghost');
const fade = document.getElementById('fade');

const CANDLE_SCENE = scenes[2];              // поговорка про свечу
const HERO_FROM = scenes[5].start - 0.4;     // персонаж приходит к блоку про марафон

function drawScene(sc, t){
  const local = t - sc.start;
  const inP = easeInOut(seg(t, sc.start - FADE * 0.6, FADE));
  const outP = easeInOut(seg(t, sc.end - FADE * 0.6, FADE));
  const vis = inP > 0 && outP < 1;
  sc.node.classList.toggle('on', vis);
  if (!vis) return;

  sc.node.style.opacity = inP * (1 - outP);
  sc.node.style.transform = `translateY(${-28 * outP}px)`;

  sc.node.querySelectorAll('.anim').forEach(node => {
    const d = parseFloat(node.dataset.d || 0);
    const dur = parseFloat(node.dataset.dur || 0.8);
    const raw = seg(local, d, dur);
    const p = node.dataset.sc ? back(raw) : easeOut(raw);
    const y = (parseFloat(node.dataset.y || 24)) * (1 - easeOut(raw));
    const from = node.dataset.sc ? parseFloat(node.dataset.sc) : 1;
    const s = from + (1 - from) * p;
    node.style.opacity = easeOut(raw);
    node.style.transform = `translateY(${y.toFixed(2)}px) scale(${s.toFixed(4)})`;
  });
}

window.setTime = function(t){
  scenes.forEach(sc => drawScene(sc, t));

  // свеча: появляется под поговорку, пламя дышит и чуть качается
  const cIn = easeOut(seg(t, CANDLE_SCENE.start - 0.2, 0.9));
  const cOut = easeInOut(seg(t, CANDLE_SCENE.end - 0.3, 0.5));
  candle.style.opacity = (cIn * (1 - cOut)).toFixed(3);
  candle.style.transform = `translateY(${(40 * (1 - cIn)).toFixed(1)}px)`;
  const flick = Math.sin(t * 7.3) * 0.5 + Math.sin(t * 3.1 + 1.7) * 0.5;
  flame.style.transform =
    `translateX(-50%) rotate(${(flick * 3).toFixed(2)}deg) scale(${(1 + flick * 0.07).toFixed(3)}, ${(1 + flick * 0.1).toFixed(3)})`;
  glow.style.opacity = (0.75 + flick * 0.25).toFixed(3);

  // фоновый иероглиф еле дышит
  ghost.style.transform = `translateY(${(10 * Math.sin(t * 0.5)).toFixed(2)}px) scale(${(1 + 0.01 * Math.sin(t * 0.4)).toFixed(4)})`;

  // персонаж приходит к блоку про марафон
  const hIn = easeOut(seg(t, HERO_FROM, 0.9));
  const breathe = 1 + 0.006 * Math.sin(t * 1.1);
  hero.style.opacity = hIn.toFixed(3);
  fade.style.opacity = hIn.toFixed(3);
  hero.style.transform =
    `translateX(${(70 * (1 - hIn)).toFixed(1)}px) translateY(${(2.5 * Math.sin(t * 0.8)).toFixed(2)}px) scale(${breathe.toFixed(4)})`;
};
window.setTime(0);
</script>
</body>
</html>
